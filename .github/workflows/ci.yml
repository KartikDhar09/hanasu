name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@62.2.0
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm test

  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret is not set, so the deploy is skipped. Add it under Settings → Secrets and variables → Actions."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Pull Vercel settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI build --token="$VERCEL_TOKEN"
      - name: Check only app files are published
        if: env.VERCEL_TOKEN != ''
        run: |
          cd .vercel/output/static && find . -type f | sort
          if find . -type f | grep -vE '^\./(index\.html|login\.html|sw\.js|manifest\.webmanifest|robots\.txt|icon(\.svg|-[0-9]+\.png)|js/[a-z0-9-]+\.js|css/[a-z0-9-]+\.css|audio/silence\.m4a|audio/[nmf]/[0-9a-f]{8}\.m4a|strokes/[0-9a-f]{5}\.json|img/book/[a-z0-9-]+(/[a-z0-9-]+)?\.jpg)$'; then
            echo "::error::Files outside the app would be published (listed above). Check .vercelignore."; exit 1
          fi
      - name: Deploy preview
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hanasu-two.vercel.app
    steps:
      - name: Check Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret is not set, so the deploy is skipped. Add it under Settings → Secrets and variables → Actions."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Pull Vercel settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI build --prod --token="$VERCEL_TOKEN"
      - name: Check only app files are published
        if: env.VERCEL_TOKEN != ''
        run: |
          cd .vercel/output/static && find . -type f | sort
          if find . -type f | grep -vE '^\./(index\.html|login\.html|sw\.js|manifest\.webmanifest|robots\.txt|icon(\.svg|-[0-9]+\.png)|js/[a-z0-9-]+\.js|css/[a-z0-9-]+\.css|audio/silence\.m4a|audio/[nmf]/[0-9a-f]{8}\.m4a|strokes/[0-9a-f]{5}\.json|img/book/[a-z0-9-]+(/[a-z0-9-]+)?\.jpg)$'; then
            echo "::error::Files outside the app would be published (listed above). Check .vercelignore."; exit 1
          fi
      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN")
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test live site
        if: env.VERCEL_TOKEN != ''
        # The site is behind a login (middleware.js), so a logged-out request must see only the login page:
        # page loads redirect to it, app files and the book answer 401, and private repo files never answer 200.
        run: |
          site=https://hanasu-two.vercel.app
          expect() { code=$(curl -s -o /dev/null -w "%{http_code}" "$2" "$site$3"); echo "$3 -> $code (want $1)"; [ "$code" = "$1" ] || { echo "::error::$3 returned $code, expected $1"; exit 1; }; }
          expect 200 -sS /login.html
          curl -s "$site/login.html" | grep -q "<title>Hanasu · Log in</title>"
          for path in /js/login.js /css/app.css /sw.js /manifest.webmanifest /icon.svg /robots.txt; do expect 200 -sS "$path"; done
          expect 302 "-HAccept: text/html" /
          curl -s -o /dev/null -w "%{redirect_url}" -H "Accept: text/html" "$site/" | grep -q "/login.html$"
          for path in /js/app.js /js/data.js /js/book-u1.js /js/book-index.js /audio/silence.m4a /index.html; do expect 401 -sS "$path"; done
          expect 401 -sS /api/auth
          for path in /scripts/check.mjs /scripts/icons.swift /.github/workflows/ci.yml /README.md /package.json /vercel.json /.vercelignore /.env.local /middleware.js /api/_session.js /api/_store.js /api/_account.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$site$path")
            echo "$path -> $code (must not be 200)"
            [ "$code" != "200" ] || { echo "::error::$path is publicly visible"; exit 1; }
          done
