name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@62.2.0
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm test

  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret is not set, so the deploy is skipped. Add it under Settings → Secrets and variables → Actions."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Pull Vercel settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI build --token="$VERCEL_TOKEN"
      - name: Check only app files are published
        if: env.VERCEL_TOKEN != ''
        run: |
          cd .vercel/output/static && find . -type f | sort
          if find . -type f | grep -vE '^\./(index\.html|sw\.js|manifest\.webmanifest|robots\.txt|icon(\.svg|-[0-9]+\.png)|js/[a-z0-9-]+\.js|css/[a-z0-9-]+\.css|audio/silence\.m4a|audio/[nmf]/[0-9a-f]{8}\.m4a|strokes/[0-9a-f]{5}\.json)$'; then
            echo "::error::Files outside the app would be published (listed above). Check .vercelignore."; exit 1
          fi
      - name: Deploy preview
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hanasu-two.vercel.app
    steps:
      - name: Check Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret is not set, so the deploy is skipped. Add it under Settings → Secrets and variables → Actions."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Pull Vercel settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes $VERCEL_CLI build --prod --token="$VERCEL_TOKEN"
      - name: Check only app files are published
        if: env.VERCEL_TOKEN != ''
        run: |
          cd .vercel/output/static && find . -type f | sort
          if find . -type f | grep -vE '^\./(index\.html|sw\.js|manifest\.webmanifest|robots\.txt|icon(\.svg|-[0-9]+\.png)|js/[a-z0-9-]+\.js|css/[a-z0-9-]+\.css|audio/silence\.m4a|audio/[nmf]/[0-9a-f]{8}\.m4a|strokes/[0-9a-f]{5}\.json)$'; then
            echo "::error::Files outside the app would be published (listed above). Check .vercelignore."; exit 1
          fi
      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN")
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test live site
        if: env.VERCEL_TOKEN != ''
        run: |
          for path in / /js/app.js /js/core.js /js/data.js /js/speech.js /css/app.css /sw.js /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hanasu-two.vercel.app$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          curl -s https://hanasu-two.vercel.app/ | grep -q "<title>Hanasu</title>"
          for path in /scripts/check.mjs /scripts/icons.swift /.github/workflows/ci.yml /README.md /package.json /vercel.json /.vercelignore /.env.local; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hanasu-two.vercel.app$path")
            echo "$path -> $code (should be private)"
            [ "$code" = "404" ] || { echo "::error::$path is publicly visible"; exit 1; }
          done
